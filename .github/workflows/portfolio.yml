name: Audit WarLike Hub portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check portfolio/portfolio.js
      - run: node --test tests/portfolio.test.mjs
      - run: |
          test -s portefeuille.html
          test -s portfolio/portfolio.css
          test -s portfolio/warlike-applications.json
